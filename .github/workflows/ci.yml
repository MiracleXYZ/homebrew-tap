name: Cask CI

on:
  push:
    branches: [main]
    paths: ['Casks/**', '.github/workflows/**']
  pull_request:
    paths: ['Casks/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Remove unused Intel runner package
        if: runner.arch == 'X64'
        # The image's old Azure CLI formula migrates to a cask during brew update,
        # which otherwise compiles unrelated dependencies on Intel.
        run: |
          if brew list --formula azure-cli >/dev/null 2>&1; then
            brew uninstall --formula --ignore-dependencies azure-cli
          fi
      - name: Prepare Homebrew
        run: |
          brew update
          brew tap miraclexyz/tap "$GITHUB_WORKSPACE"
          brew trust --cask miraclexyz/tap/aerotab
      - name: Check cask style
        run: brew style --cask miraclexyz/tap/aerotab
      - name: Install cask
        run: brew install --cask miraclexyz/tap/aerotab
      - name: Verify installed app
        run: |
          codesign --verify --strict /Applications/AeroTab.app
          test "$(lipo -archs /Applications/AeroTab.app/Contents/MacOS/AeroTab)" = "$(uname -m)"
          python3 - <<'PYTHON'
          import subprocess
          from pathlib import Path
          import plistlib
          import re
          app = Path('/Applications/AeroTab.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          cask = Path('Casks/aerotab.rb').read_text()
          version = re.search(r'^  version "([^" ]+)"$', cask, re.MULTILINE)[1]
          assert info['CFBundleShortVersionString'] == version
          assert info['CFBundleIdentifier'] == 'dev.miraclexyz.AeroTab'
          attributes = subprocess.check_output(['/usr/bin/xattr', '-r', str(app)], text=True)
          assert 'com.apple.quarantine' not in attributes
          print('Version, architecture, signature, and quarantine handling verified.')
          PYTHON
      - name: Uninstall test app
        if: always()
        run: |
          if brew list --cask | grep -qx aerotab; then
            brew uninstall --cask miraclexyz/tap/aerotab
          fi
